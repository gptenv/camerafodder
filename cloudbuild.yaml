substitutions:
  _REGION: us-central1
  _SERVICE: camerafodder

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        gcloud artifacts repositories describe camerafodder \
          --project "$PROJECT_ID" \
          --location "${_REGION}" >/dev/null 2>&1 \
          || gcloud artifacts repositories create camerafodder \
            --project "$PROJECT_ID" \
            --location "${_REGION}" \
            --repository-format docker
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/camerafodder/app:$SHORT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/camerafodder/app:$SHORT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/camerafodder/app:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --set-env-vars
      - AUTH_STORE_PATH=/tmp/camerafodder/auth.json,RUST_LOG=info

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/camerafodder/app:$SHORT_SHA
